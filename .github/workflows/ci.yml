name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GEN: ninja
  SEXTANT_ENGINE_REPO: git@github.com:rescbr/sextant-engine.git

jobs:
  linux:
    name: Linux (portable x86-64-v3)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # The engine lives in a sibling private repo; clone it with a
      # read-only deploy key so the CMake default ../sextant-engine
      # path resolves exactly like a local workspace.
      - name: Checkout sextant-engine (deploy key)
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SEXTANT_ENGINE_DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          git clone --depth 1 "$SEXTANT_ENGINE_REPO" ../sextant-engine

      - name: Install toolchain
        run: |
          sudo apt-get update -y -qq
          sudo apt-get install -y -qq clang ninja-build
          python3 -m pip install meson

      # Portable profile: GH runners must not require the dev machine's
      # AVX512 build. Built into the default build-x86 dir the extension
      # CMake expects.
      - name: Build sextant-engine
        run: |
          meson setup ../sextant-engine/build-x86 --native-file ../sextant-engine/clang.ini -Dcpu_arch=x86-64-v3
          ninja -C ../sextant-engine/build-x86

      - name: Build extension
        run: make release

      - name: Test extension
        run: make test_release
